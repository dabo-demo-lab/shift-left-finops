# Feedback FinOps en cada PR: planifica TODOS los entornos que el cambio
# alcanza, estima horas mínimas y costo de lista, evalúa reglas de alcance
# (advisory) y publica un único comentario. Nunca ejecuta `apply`.
name: finops-pr

on:
  pull_request:
    branches: [main]
    paths:
      - "envs/**"
      - "modules/**"
      - "profiles/**"
      - "pricing/**"
      - "tools/finops/**"
      - "policies/**"
      - ".github/workflows/finops-pr.yml"

permissions: {}

concurrency:
  group: finops-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-2
  INFRACOST_VERSION: v2.17.0
  INFRACOST_SHA256: 970043bf619d0b2fcdb5e97e52088c691720cc57f71210c142e5a867dc5bd204
  CONFTEST_VERSION: 0.71.1
  CONFTEST_SHA256: c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985

jobs:
  scope:
    name: Entornos afectados
    # Los PRs desde forks no reciben token OIDC ni secretos.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      envs: ${{ steps.affected.outputs.envs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/finops/affected_envs.py "$BASE_SHA" "$HEAD_SHA" | tee -a "$GITHUB_OUTPUT"

  checks:
    name: Pruebas de herramientas y reglas
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar conftest
        run: |
          curl -fsSLo conftest.tgz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tgz" | sha256sum -c -
          tar -xzf conftest.tgz conftest && sudo mv conftest /usr/local/bin/

      - run: python3 -m unittest discover -s tools/finops -v
      - run: conftest verify --policy policies

  plan:
    name: Plan · ${{ matrix.env }}
    needs: scope
    if: needs.scope.outputs.envs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.scope.outputs.envs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: tf
        run: echo "version=$(cat .terraform-version)" >> "$GITHUB_OUTPUT"

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ steps.tf.outputs.version }}
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: finops-pr-${{ github.event.pull_request.number }}-${{ matrix.env }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform plan
        working-directory: envs/${{ matrix.env }}
        run: |
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -lock-timeout=2m -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Instalar Infracost
        run: |
          curl -fsSLo infracost.tgz "https://github.com/infracost/cli/releases/download/${INFRACOST_VERSION}/infracost-linux-amd64.tar.gz"
          echo "${INFRACOST_SHA256}  infracost.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/infracost" && tar -xzf infracost.tgz -C "$RUNNER_TEMP/infracost"
          find "$RUNNER_TEMP/infracost" -type f -name 'infracost*' -perm -u+x -exec install {} /usr/local/bin/infracost \; -quit
          infracost --version

      # Infracost no bloquea el comentario: si falla, la columna dice "no disponible".
      - name: Infracost
        continue-on-error: true
        timeout-minutes: 8
        working-directory: envs/${{ matrix.env }}
        env:
          INFRACOST_CLI_AUTHENTICATION_TOKEN: ${{ secrets.INFRACOST_CLI_AUTHENTICATION_TOKEN }}
          INFRACOST_CLI_ORG: dabo-demo
        run: |
          infracost scan plan.json --no-color
          infracost inspect --json --no-color > infracost.json

      # Solo el resumen sale del job: el plan contiene ARNs y el ID de la cuenta.
      - name: Resumen del entorno
        run: |
          mkdir -p summary
          python3 tools/finops/env_summary.py "${{ matrix.env }}" "envs/${{ matrix.env }}/plan.json" "envs/${{ matrix.env }}/infracost.json" > "summary/${{ matrix.env }}.json"
          cat "summary/${{ matrix.env }}.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: summary-${{ matrix.env }}
          path: summary/${{ matrix.env }}.json
          retention-days: 7

  comment:
    name: Comentario del PR
    needs: [scope, plan]
    if: always() && needs.scope.outputs.envs != '[]' && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: summary-*
          path: summaries
          merge-multiple: true

      - name: Instalar conftest
        run: |
          curl -fsSLo conftest.tgz "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          echo "${CONFTEST_SHA256}  conftest.tgz" | sha256sum -c -
          tar -xzf conftest.tgz conftest && sudo mv conftest /usr/local/bin/

      - name: Reglas de alcance y comentario
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 tools/finops/render_comment.py input summaries "$BASE_SHA" "$HEAD_SHA" > input.json
          conftest test input.json --policy policies --output json > conftest.json || true
          python3 tools/finops/render_comment.py render input.json summaries conftest.json "$HEAD_SHA" > comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      # Un solo comentario por PR: se actualiza en cada push.
      - name: Publicar comentario
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- finops-pr-comment -->")))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
